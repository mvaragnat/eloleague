# Game sites: the same application served on a dedicated domain, locked on a single game system.
#
# Domains are bound to a site key through the GAME_SITES environment variable:
#   GAME_SITES="epic.example.com=epic_ferc,trench-crusade.eloleague.com=trench_crusade,confrontation.eloleague.com=confrontation"
# Requests coming from any other host get the regular, multi-game site.
#
# Per site:
#   game_system: name of the Game::System (as in config/game_systems.yml) the site is locked on
#   theme:       optional stylesheet loaded after application.css (app/assets/stylesheets/themes/<theme>.css)
#   icon:        optional favicon path (served from public/)
#   og_image:    optional social sharing image path (served from public/), 1200x630, shown in link previews (Discord, social networks)
#   theme_color: optional color of the link preview accent bar (Discord) and of the mobile browser toolbar
#   parent_url:  optional URL of the site this one is part of; the nav logo links to it
#   default_locale: optional locale used when the visitor has not picked one (defaults to I18n.default_locale)
#
# Environment: <SITE KEY>_DISCORD_URL (e.g. EPIC_FERC_DISCORD_URL) holds the community Discord invite, linked from the home.
#
# Texts: any translation key can be overridden for a site under `game_sites.<site key>.<key>`
# in config/locales (e.g. game_sites.epic_ferc.app.name). Missing keys fall back to the base text.

epic_ferc:
  game_system: "Epic Armageddon - FERC"
  theme: epic_ferc
  icon: "/sites/epic_ferc/icon.png"
  og_image: "/sites/epic_ferc/og.jpg"
  theme_color: "#c8a052"
  parent_url: "https://www.epicarmageddon.fr"
  default_locale: fr

# Look inspired by https://www.trenchcrusade.fr. No image or font of that site may be used (no rights).
trench_crusade:
  game_system: "Trench Crusade"
  theme: trench_crusade
  icon: "/sites/trench_crusade/icon.png"
  og_image: "/sites/trench_crusade/og.jpg"
  theme_color: "#8f1519"
  default_locale: fr

# Look and images of https://confederation-dragon-rouge.fr (images reused with permission).
confrontation:
  game_system: "Confrontation"
  theme: confrontation
  icon: "/sites/confrontation/icon.png"
  og_image: "/sites/confrontation/og.jpg"
  theme_color: "#972825"
  default_locale: fr
